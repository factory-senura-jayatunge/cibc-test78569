name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, format, dead code, duplication, docs, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Dead code and unused dependencies
        run: npm run deadcode
      - name: Duplicate code
        run: npm run duplication
      - name: AGENTS.md and docs match the code
        run: npm run docs:check
      - name: No oversized files
        run: npm run files:check
      - name: Tests with coverage thresholds
        run: npm run test:coverage

  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  coupling:
    name: Coupling report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run coupling
      - name: Publish coupling report
        run: cat out/coupling-report.md >> "$GITHUB_STEP_SUMMARY"

  impact:
    name: Change impact and scoped regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Impact analysis against the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run impact -- --base "origin/$BASE_REF"
      - name: Scoped regression
        run: npm run regression:scoped
      - name: Publish impact report
        if: always()
        run: |
          if [ -f out/impact-report.md ]; then cat out/impact-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-evidence
          path: out/
          if-no-files-found: ignore
