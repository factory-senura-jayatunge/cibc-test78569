name: Security scan

# SCA: `npm audit` converted to SARIF and uploaded to code scanning. The audit step keeps
# going while advisories are open (npm audit exits 1), so the SARIF still uploads; open
# findings are tracked as code-scanning alerts and archived under security/findings/.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    name: Dependency audit (npm audit to SARIF)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run npm audit
        run: |
          mkdir -p out
          npm audit --json > out/npm-audit.json || true
      - name: Convert the audit report to SARIF
        run: node scripts/audit-to-sarif.js out/npm-audit.json out/security-scan.sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/security-scan.sarif
          category: npm-audit
