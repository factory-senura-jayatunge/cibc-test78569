version: 2
updates:
  # Dev tooling only: the application has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain guard: only propose releases that have been public for at least 7 days
    # (14 for major versions). See "Dependency updates" in CONTRIBUTING.md.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: increase
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
